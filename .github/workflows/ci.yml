name: CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:

jobs:
  backend:
    name: backend (build & test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & Test
        working-directory: backend
        env:
          # Testcontainers (auth-service): aponta o socket e fixa a API
          # (Docker >= 29 exige >= 1.40; versão forçada em docker-java.properties).
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_API_VERSION: "1.44"
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          chmod +x ./mvnw
          set +e
          ./mvnw -B -ntp clean verify 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            diag=$(
              for f in $(find . -path '*/surefire-reports/*.txt'); do
                if grep -qE '<<< (FAILURE|ERROR)!' "$f"; then
                  echo "=== $f ==="
                  grep -A 6 -E '<<< (FAILURE|ERROR)!' "$f" | head -n 30
                  grep -E 'Caused by:' "$f" | head -n 6
                fi
              done
              echo '--- resumo ---'
              grep -E 'Tests run:|BUILD FAILURE' /tmp/build.log | tail -n 10
            )
            diag=$(printf '%s' "$diag" | sed -z 's/%/%25/g; s/\r//g; s/\n/%0A/g')
            echo "::error title=Build diagnostics::${diag}"
          fi
          exit "$code"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: ignore
