name: CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:

jobs:
  auth-service:
    name: auth-service (build & test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & Test
        working-directory: backend/auth-service
        # Usa o Maven Wrapper (3.9.16) para garantir a versão exigida pelo Spring Boot 4.
        # Em caso de falha, exporta o fim do log como annotation (legível via API pública).
        run: |
          chmod +x ./mvnw
          set +e
          ./mvnw -B -ntp clean verify 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::group::Maven failure tail"
            tail -n 150 /tmp/build.log
            echo "::endgroup::"
            msg=$(tail -n 120 /tmp/build.log | sed -z 's/%/%25/g; s/\r//g; s/\n/%0A/g')
            echo "::error title=Maven build failure::${msg}"
          fi
          exit "$code"
