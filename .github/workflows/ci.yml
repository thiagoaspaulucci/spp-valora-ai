name: CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:

jobs:
  auth-service:
    name: auth-service (build & test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & Test
        working-directory: backend/auth-service
        env:
          # Testcontainers: aponta o socket e fixa a API (Docker >= 29 exige >= 1.40;
          # a versão efetiva é forçada em src/test/resources/docker-java.properties).
          DOCKER_HOST: unix:///var/run/docker.sock
          DOCKER_API_VERSION: "1.44"
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/auth-service/target/surefire-reports/
          if-no-files-found: ignore
