name: CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:

jobs:
  auth-service:
    name: auth-service (build & test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Docker sanity
        run: |
          info=$( (echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"; echo '--- docker version ---'; docker version 2>&1; echo '--- docker info (head) ---'; docker info 2>&1 | head -25; echo '--- socket ---'; ls -l /var/run/docker.sock 2>&1) | sed -z 's/%/%25/g; s/\r//g; s/\n/%0A/g')
          echo "::warning title=Docker sanity::${info}"

      - name: Build & Test
        working-directory: backend/auth-service
        run: |
          chmod +x ./mvnw
          set +e
          ./mvnw -B -ntp clean verify 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            diag=$( (grep -iE 'docker|testcontainers|ryuk|\.sock|DockerClientProviderStrategy|Could not|environment|BUILD FAILURE|Tests run' /tmp/build.log | tail -n 80) | sed -z 's/%/%25/g; s/\r//g; s/\n/%0A/g')
            echo "::error title=Build diagnostics::${diag}"
          fi
          exit "$code"
