spring.application.name=ai-service
spring.profiles.default=dev

server.port=8085

spring.jpa.hibernate.ddl-auto=validate

# Isolamento por esquema dentro da instância Postgres compartilhada
spring.flyway.enabled=true
spring.flyway.schemas=ai
spring.flyway.default-schema=ai
spring.jpa.properties.hibernate.default_schema=ai

# Resource Server: valida JWT contra o JWKS do auth-service
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8080/oauth2/jwks}

# Comunicação com o property-service
spp.property-service.uri=${PROPERTY_SERVICE_URI:http://localhost:8081}

# Modelo de IA (heurística explicável; ponto de integração para ML/LLM)
spp.ai.model-version=heuristic-v1
spp.ai.base-price-per-sqm=8200
spp.ai.type-weights.APARTMENT=1.00
spp.ai.type-weights.HOUSE=1.05
spp.ai.type-weights.COMMERCIAL=1.20
spp.ai.type-weights.LAND=0.60

# Actuator / Observabilidade
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

logging.pattern.level=%5p [%X{traceId:-}]
