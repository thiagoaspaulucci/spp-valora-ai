# Perfil de produção.
# TODOS os segredos e chaves são obrigatórios via variáveis de ambiente
# (a aplicação falha ao iniciar se ausentes) — nada sensível fica no código.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

spring.jpa.show-sql=false

# Chaves RSA persistentes (PEM) — obrigatórias em produção
spp.security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
spp.security.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}

# Origens do frontend em produção (lista separada por vírgula)
spp.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
