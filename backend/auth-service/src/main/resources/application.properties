spring.application.name=auth-service
spring.profiles.default=dev

server.port=8080

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# JWT
spp.security.jwt.issuer=spp-valora-auth
spp.security.jwt.access-token-ttl=15m
spp.security.jwt.refresh-token-ttl=7d

# CORS (origens do frontend)
spp.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Proteção contra força bruta no login
spp.security.login.max-attempts=5
spp.security.login.block-duration=15m

# Actuator / Observabilidade
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Correlação nos logs
logging.pattern.level=%5p [%X{traceId:-}]
