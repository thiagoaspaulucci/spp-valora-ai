server:
  port: 8090

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Valida os JWT contra o JWKS exposto pelo auth-service.
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8080/oauth2/jwks}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8080}
              predicates:
                - Path=/api/v1/auth/**,/oauth2/jwks

spp:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
