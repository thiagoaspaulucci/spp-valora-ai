spring.application.name=market-service
spring.profiles.default=dev

server.port=8084

spring.jpa.hibernate.ddl-auto=validate

# Isolamento por esquema dentro da instância Postgres compartilhada
spring.flyway.enabled=true
spring.flyway.schemas=market
spring.flyway.default-schema=market
spring.jpa.properties.hibernate.default_schema=market

# Resource Server: valida JWT contra o JWKS do auth-service
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8080/oauth2/jwks}

# Actuator / Observabilidade
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

logging.pattern.level=%5p [%X{traceId:-}]
