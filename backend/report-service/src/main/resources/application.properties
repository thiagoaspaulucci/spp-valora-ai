spring.application.name=report-service
spring.profiles.default=dev

server.port=8083

spring.jpa.hibernate.ddl-auto=validate

# Isolamento por esquema dentro da instância Postgres compartilhada
spring.flyway.enabled=true
spring.flyway.schemas=report
spring.flyway.default-schema=report
spring.jpa.properties.hibernate.default_schema=report

# Resource Server: valida JWT contra o JWKS do auth-service
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8080/oauth2/jwks}

# Comunicação com o valuation-service
spp.valuation-service.uri=${VALUATION_SERVICE_URI:http://localhost:8082}

# Actuator / Observabilidade
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

logging.pattern.level=%5p [%X{traceId:-}]
