spring.application.name=valuation-service
spring.profiles.default=dev

server.port=8082

spring.jpa.hibernate.ddl-auto=validate

# Isolamento por esquema dentro da instância Postgres compartilhada
spring.flyway.enabled=true
spring.flyway.schemas=valuation
spring.flyway.default-schema=valuation
spring.jpa.properties.hibernate.default_schema=valuation

# Resource Server: valida JWT contra o JWKS do auth-service
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8080/oauth2/jwks}

# Comunicação com o property-service
spp.property-service.uri=${PROPERTY_SERVICE_URI:http://localhost:8081}

# Parâmetros da fórmula de valoração
spp.valuation.base-price-per-sqm=8000
spp.valuation.type-multipliers.APARTMENT=1.00
spp.valuation.type-multipliers.HOUSE=1.05
spp.valuation.type-multipliers.COMMERCIAL=1.20
spp.valuation.type-multipliers.LAND=0.60

# Actuator / Observabilidade
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

logging.pattern.level=%5p [%X{traceId:-}]
