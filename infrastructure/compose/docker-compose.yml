services:

  postgres:
    image: postgres:17
    container_name: spp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spp_valora}
      POSTGRES_USER: ${POSTGRES_USER:-spp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spp123}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spp} -d ${POSTGRES_DB:-spp_valora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: spp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-spp123}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-spp123} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ../../backend
      dockerfile: auth-service/Dockerfile
    container_name: spp-auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-spp_valora}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-spp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-spp123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-spp123}
    ports:
      - "8080:8080"
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  property-service:
    build:
      context: ../../backend
      dockerfile: property-service/Dockerfile
    container_name: spp-property-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-spp_valora}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-spp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-spp123}
      AUTH_JWKS_URI: http://auth-service:8080/oauth2/jwks
    ports:
      - "8081:8081"
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  valuation-service:
    build:
      context: ../../backend
      dockerfile: valuation-service/Dockerfile
    container_name: spp-valuation-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-spp_valora}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-spp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-spp123}
      AUTH_JWKS_URI: http://auth-service:8080/oauth2/jwks
      PROPERTY_SERVICE_URI: http://property-service:8081
    ports:
      - "8082:8082"
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  report-service:
    build:
      context: ../../backend
      dockerfile: report-service/Dockerfile
    container_name: spp-report-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-spp_valora}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-spp}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-spp123}
      AUTH_JWKS_URI: http://auth-service:8080/oauth2/jwks
      VALUATION_SERVICE_URI: http://valuation-service:8082
    ports:
      - "8083:8083"
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  gateway:
    build:
      context: ../../backend
      dockerfile: gateway/Dockerfile
    container_name: spp-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
    environment:
      AUTH_SERVICE_URI: http://auth-service:8080
      AUTH_JWKS_URI: http://auth-service:8080/oauth2/jwks
      PROPERTY_SERVICE_URI: http://property-service:8081
      VALUATION_SERVICE_URI: http://valuation-service:8082
      REPORT_SERVICE_URI: http://report-service:8083
    ports:
      - "8090:8090"
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:

  postgres-data:
